<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jin Tools - WhatsApp Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            jin: '#8b5cf6',
            'jin-dark': '#7c3aed',
          },
          fontFamily: {
            'sans': ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <script>
    function updateMessage() {
      const username = document.getElementById('username').value.trim();

      const message = `✨ *Jin Tools Account* ✨

👤 *Username:* ${username}
🔑 *Password:* ${username}

🌐 *Login:*
https://app.jintools.com/

⚠️ *IMPORTANT:*
• Login from 1 device only
• Use 1 browser only  
• Multiple logins = Auto Block ❌

📺 *Setup Guides:*

💻 *Desktop:*
https://www.loom.com/share/b708c3a587cb4a43ab00dd2763a04779

📱 *Mobile:*
https://www.youtube.com/shorts/VGwiItMNlLo

💬 *Join WhatsApp Channel:*
Get updates, offers & giveaways
https://whatsapp.com/channel/0029VbCTidA9WtC0o9fBBK3y

🚀 *Thank you for choosing Jin Tools!*`;

      document.getElementById('copy-text').value = message;
      document.getElementById('copy-btn').disabled = username === '';
      
      // Update character count
      document.getElementById('char-count').textContent = message.length;
    }

    function copyToClipboard() {
      const textArea = document.getElementById('copy-text');
      textArea.select();
      textArea.setSelectionRange(0, 99999);
      document.execCommand("copy");

      const toast = document.getElementById('toast');
      toast.classList.remove('opacity-0', 'translate-y-10');
      toast.classList.add('opacity-100', 'translate-y-0');

      const btn = document.getElementById('copy-btn');
      const originalHTML = btn.innerHTML;
      btn.innerHTML = '<i class="fas fa-check mr-2"></i> Copied!';
      btn.classList.add('copied');
      
      setTimeout(() => {
        btn.innerHTML = originalHTML;
        btn.classList.remove('copied');
      }, 2000);

      setTimeout(() => {
        toast.classList.remove('opacity-100', 'translate-y-0');
        toast.classList.add('opacity-0', 'translate-y-10');
      }, 2500);
    }

    function sendToWhatsApp() {
      const message = document.getElementById('copy-text').value;
      const encodedMessage = encodeURIComponent(message);
      window.open(`https://wa.me/?text=${encodedMessage}`, '_blank');
    }

    function toggleDarkMode() {
      const html = document.documentElement;
      html.classList.toggle('dark');
      const isDark = html.classList.contains('dark');
      localStorage.setItem('darkMode', isDark);
      document.getElementById('dark-mode-toggle').innerHTML = isDark ?
        '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
    }

    function generateRandomUsername() {
      const prefixes = ['seo', 'digital', 'web', 'smart', 'pro'];
      const suffixes = ['expert', 'master', 'ninja', 'guru', 'ace'];
      const numbers = Math.floor(100 + Math.random() * 900);
      const username = `${prefixes[Math.floor(Math.random() * prefixes.length)]}_${suffixes[Math.floor(Math.random() * suffixes.length)]}${numbers}`;
      document.getElementById('username').value = username;
      updateMessage();
    }

    function clearUsername() {
      document.getElementById('username').value = '';
      updateMessage();
    }

    document.addEventListener('DOMContentLoaded', function () {
      if (localStorage.getItem('darkMode') === 'true') {
        document.documentElement.classList.add('dark');
        document.getElementById('dark-mode-toggle').innerHTML = '<i class="fas fa-sun"></i>';
      }
      document.getElementById('copy-btn').disabled = true;
      updateMessage();
    });
  </script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: 'Inter', sans-serif;
    }

    .dark body {
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 1rem;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease;
    }

    .dark .card {
      background: #1e293b;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .logo {
      width: 60px;
      height: 60px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      border-radius: 15px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1rem;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .title {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1f2937;
      margin-bottom: 0.5rem;
    }

    .dark .title {
      color: #f3f4f6;
    }

    .subtitle {
      color: #6b7280;
      font-size: 0.9rem;
    }

    .dark .subtitle {
      color: #9ca3af;
    }

    .input-group {
      margin-bottom: 1.5rem;
    }

    .label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      color: #374151;
      font-size: 0.9rem;
    }

    .dark .label {
      color: #d1d5db;
    }

    .input-wrapper {
      position: relative;
    }

    .input-field {
      width: 100%;
      padding: 0.875rem 3rem 0.875rem 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 1rem;
      transition: all 0.3s ease;
      background: white;
    }

    .dark .input-field {
      background: #0f172a;
      border-color: #334155;
      color: #f3f4f6;
    }

    .input-field:focus {
      outline: none;
      border-color: #8b5cf6;
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1);
    }

    .input-actions {
      position: absolute;
      right: 0.75rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      gap: 0.5rem;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #9ca3af;
      cursor: pointer;
      padding: 0.25rem;
      transition: all 0.2s;
      font-size: 1.1rem;
    }

    .icon-btn:hover {
      color: #8b5cf6;
      transform: scale(1.1);
    }

    .textarea {
      width: 100%;
      padding: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 12px;
      font-size: 0.875rem;
      line-height: 1.6;
      resize: none;
      font-family: 'Inter', monospace;
      background: #f9fafb;
      height: 320px;
    }

    .dark .textarea {
      background: #0f172a;
      border-color: #334155;
      color: #e5e7eb;
    }

    .textarea:focus {
      outline: none;
      border-color: #8b5cf6;
    }

    .char-count {
      text-align: right;
      font-size: 0.75rem;
      color: #9ca3af;
      margin-top: 0.25rem;
    }

    .btn {
      width: 100%;
      padding: 1rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6, #7c3aed);
      color: white;
      box-shadow: 0 4px 15px rgba(139, 92, 246, 0.4);
    }

    .btn-primary:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(139, 92, 246, 0.5);
    }

    .btn-primary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary.copied {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .btn-secondary {
      background: white;
      color: #8b5cf6;
      border: 2px solid #8b5cf6;
      margin-top: 0.75rem;
    }

    .dark .btn-secondary {
      background: #1e293b;
      border-color: #8b5cf6;
      color: #a78bfa;
    }

    .btn-secondary:hover {
      background: #8b5cf6;
      color: white;
      transform: translateY(-2px);
    }

    .dark .btn-secondary:hover {
      background: #7c3aed;
    }

    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
      padding: 1rem 2rem;
      border-radius: 50px;
      box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      opacity: 0;
      transition: all 0.4s cubic-bezier(0.68, -0.55, 0.27, 1.55);
      z-index: 1000;
    }

    .toast.opacity-100 {
      opacity: 1;
    }

    .toast.translate-y-0 {
      transform: translateX(-50%) translateY(0);
    }

    .dark-toggle {
      position: fixed;
      top: 1rem;
      right: 1rem;
      background: white;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      color: #8b5cf6;
      font-size: 1.2rem;
    }

    .dark .dark-toggle {
      background: #1e293b;
      color: #fbbf24;
    }

    .dark-toggle:hover {
      transform: scale(1.1);
    }

    .tip {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.1), rgba(236, 72, 153, 0.1));
      border-left: 4px solid #8b5cf6;
      padding: 0.875rem;
      border-radius: 8px;
      font-size: 0.85rem;
      color: #6b7280;
      margin-top: 1rem;
    }

    .dark .tip {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.2));
      color: #9ca3af;
    }

    .tip i {
      color: #8b5cf6;
      margin-right: 0.5rem;
    }

    @media (max-width: 640px) {
      .card {
        padding: 1.5rem;
      }
      
      .title {
        font-size: 1.5rem;
      }
      
      .textarea {
        height: 280px;
      }
    }
  </style>
</head>

<body>
  <button id="dark-mode-toggle" onclick="toggleDarkMode()" class="dark-toggle">
    <i class="fas fa-moon"></i>
  </button>

  <div class="container">
    <div class="card">
      <div class="header">
        <div class="logo">
          <i class="fas fa-magic text-white text-2xl"></i>
        </div>
        <h1 class="title">Jin Tools Generator</h1>
        <p class="subtitle">WhatsApp-Ready Credentials</p>
      </div>

      <div class="input-group">
        <label class="label">
          <i class="fas fa-user mr-2"></i>Username
        </label>
        <div class="input-wrapper">
          <input 
            id="username" 
            type="text" 
            class="input-field" 
            placeholder="Enter username"
            oninput="updateMessage()" 
          />
          <div class="input-actions">
            <button onclick="clearUsername()" class="icon-btn" title="Clear">
              <i class="fas fa-times"></i>
            </button>
            <button onclick="generateRandomUsername()" class="icon-btn" title="Random">
              <i class="fas fa-dice"></i>
            </button>
          </div>
        </div>
      </div>

      <div class="input-group">
        <label class="label">
          <i class="fab fa-whatsapp mr-2"></i>WhatsApp Message
        </label>
        <textarea 
          id="copy-text" 
          class="textarea" 
          readonly
          placeholder="Your WhatsApp-ready message will appear here..."
        ></textarea>
        <div class="char-count">
          <span id="char-count">0</span> characters
        </div>
      </div>

      <button id="copy-btn" onclick="copyToClipboard()" class="btn btn-primary" disabled>
        <i class="fas fa-copy"></i>
        Copy to Clipboard
      </button>

      <button onclick="sendToWhatsApp()" class="btn btn-secondary">
        <i class="fab fa-whatsapp"></i>
        Send to WhatsApp
      </button>

      <div class="tip">
        <i class="fas fa-lightbulb"></i>
        <strong>Tip:</strong> Message is optimized for WhatsApp with proper formatting and emojis
      </div>
    </div>
  </div>

  <div id="toast" class="toast">
    <i class="fas fa-check-circle"></i>
    Copied successfully!
  </div>
</body>
</html>
