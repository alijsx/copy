<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Copy Credentials</title>
  <script>
    function updateMessage() {
      const username = document.getElementById('username').value.trim();
      const message = `
username : ${username}
password : ${username}

login link :  https://app.sastaseotools.com/

Follow WhatsApp Group For Updates & Offers 🫴 And Giveaways ✅

      `;
      document.getElementById('copy-text').value = message;

    function copyToClipboard() {
      const textArea = document.getElementById('copy-text');
      textArea.select();
      textArea.setSelectionRange(0, 99999); // For mobile devices
      document.execCommand("copy");
      alert("Copied to clipboard!");
    }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 p-6">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-md">
    <h1 class="text-xl font-semibold mb-4">Enter Username to Copy Login Info</h1>

    <input id="username" type="text" placeholder="Enter username"
      class="w-full border border-gray-300 rounded px-4 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-400"
      oninput="updateMessage()" />

    <textarea id="copy-text" class="w-full h-64 border border-gray-300 rounded px-4 py-2 mb-4" readonly></textarea>

    <button onclick="copyToClipboard()" class="bg-blue-600 text-white px-6 py-2 rounded hover:bg-blue-700 transition">
